name: "Podcast Generator"
author: "Harold Carbonell"
description: "Generates a feed for a product from YAML file"

runs:
  using: "docker"
  image: "Docerfile"
Brandding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: "The commiter's email address"
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: The commiter's name
    required: true
    default: ${{ github.actor }}